# Application name and server port
spring:
  application:
    name: api-gateway
  data:
    redis:
      # This identifies this specific app in the Redis client list
      client-name: gateway-service
  boot:
    admin:
      client:
        url: http://localhost:8097
  main:
    web-application-type: reactive
  cloud:
    gateway:
      httpclient:
        connect-timeout: 90000 # Increase to 60 seconds
        response-timeout: 90s
      globalCors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "https://destiny1website.netlify.app"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowed-headers: "*"
            allow-credentials: true
      routes:
        # Example of Rate-Limited Routes
        - id: jwt-module
          uri: lb://JWT-MODULE
          predicates:
            - Path=/api/auth/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5   # 5 requests per second
                redis-rate-limiter.burstCapacity: 10  # Allows burst requests
                key-resolver: "#{@jwtKeyResolver}"

        - id: user-module
          uri: lb://USER-MODULE
          predicates:
            - Path=/api/users/**,/uploads/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5   # 5 requests per second
                redis-rate-limiter.burstCapacity: 10  # Allows burst requests
                key-resolver: "#{@jwtKeyResolver}"

        - id: post-module
          uri: lb://POST-MODULE
          predicates:
            - Path=/posts/**,/uploads/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5   # 5 requests per second
                redis-rate-limiter.burstCapacity: 10  # Allows burst requests
                key-resolver: "#{@jwtKeyResolver}"

        - id: like-module
          uri: lb://LIKE-MODULE
          predicates:
            - Path=/likes/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5   # 5 requests per second
                redis-rate-limiter.burstCapacity: 10  # Allows burst requests
                key-resolver: "#{@jwtKeyResolver}"

        - id: comment-module
          uri: lb://COMMENT-MODULE
          predicates:
            - Path=/comments/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5   # 5 requests per second
                redis-rate-limiter.burstCapacity: 10  # Allows burst requests
                key-resolver: "#{@jwtKeyResolver}"

        - id: status-module
          uri: lb://STATUS-MODULE
          predicates:
            - Path=/statuses/**,/uploads/**
          filters:
            - name: JwtAuthFilter
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5   # 5 requests per second
                redis-rate-limiter.burstCapacity: 10  # Allows burst requests
                key-resolver: "#{@jwtKeyResolver}"

        - id: follow-module
