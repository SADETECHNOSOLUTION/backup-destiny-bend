# Eureka configuration
eureka:
  client:
    service-url:
      defaultZone: https://destiny-eureka.onrender.com/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    # Crucial for Render deployment
    hostname: rummy-api-gateway.onrender.com # Change to your Gateway's Render URL
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

server:
  port: 8080

jwt:
